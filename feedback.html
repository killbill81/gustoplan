<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GustoPlan - Feedback</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tomato: {
                            light: '#ff8a65',
                            DEFAULT: '#ff6347',
                            dark: '#c54935',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 font-sans antialiased min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Votre avis compte !
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Aidez-nous à améliorer GustoPlan en signalant un bug ou en suggérant une idée.
            </p>
        </div>

        <form class="mt-8 space-y-6" id="feedback-form">
            <div class="rounded-md shadow-sm -space-y-px">
                <!-- Type Selection -->
                <div class="mb-4">
                    <label for="type" class="block text-sm font-medium text-gray-700 mb-1">Type de retour</label>
                    <select id="type" name="type"
                        class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-tomato focus:border-tomato focus:z-10 sm:text-sm">
                        <option value="bug">🐛 Signaler un Bug</option>
                        <option value="feature">💡 Idée de fonctionnalité</option>
                        <option value="avis">❤️ Avis général</option>
                    </select>
                </div>

                <!-- Message -->
                <div class="mb-4">
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                    <textarea id="message" name="message" rows="5" required
                        class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-tomato focus:border-tomato focus:z-10 sm:text-sm"
                        placeholder="Décrivez le problème ou votre idée..."></textarea>
                </div>

                <!-- Contact (Optional) -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email pour vous répondre
                        (optionnel)</label>
                    <input id="email" name="email" type="email"
                        class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-tomato focus:border-tomato focus:z-10 sm:text-sm"
                        placeholder="votre@email.com">
                </div>
            </div>

            <div>
                <button type="submit" id="submit-btn"
                    class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-tomato hover:bg-tomato-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-tomato transition-colors">
                    Envoyer
                </button>
            </div>

            <div id="status-msg" class="hidden text-center text-sm font-medium mt-4"></div>
        </form>

        <div class="text-center mt-4">
            <a href="index.html" class="font-medium text-tomato hover:text-tomato-dark">
                Retour à l'application
            </a>
        </div>
    </div>

    <!-- Standalone Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuration copied from project to ensure standalone functionality
        const firebaseConfig = {
            apiKey: "AIzaSyDif5g62oVWT460e5q3Kpg7txgRN8VXk24",
            authDomain: "gustoplan-dev.firebaseapp.com",
            projectId: "gustoplan-dev",
            storageBucket: "gustoplan-dev.firebasestorage.app",
            messagingSenderId: "554162135180",
            appId: "1:554162135180:web:f5addf322a0977ffe31ba9",
            databaseURL: "https://gustoplan-dev-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('feedback-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('status-msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi...';

            const type = document.getElementById('type').value;
            const message = document.getElementById('message').value;
            const email = document.getElementById('email').value;

            try {
                // Add to 'feedback' collection
                await addDoc(collection(db, 'feedback'), {
                    type,
                    message,
                    contactEmail: email,
                    timestamp: serverTimestamp(),
                    userAgent: navigator.userAgent,
                    url: window.location.href
                });

                statusMsg.textContent = "Merci ! Votre message a bien été reçu.";
                statusMsg.className = "text-center text-sm font-medium mt-4 text-green-600 block";
                form.reset();
            } catch (error) {
                console.error("Error:", error);
                statusMsg.textContent = "Erreur lors de l'envoi : " + error.message;
                statusMsg.className = "text-center text-sm font-medium mt-4 text-red-600 block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Envoyer';
            }
        });
    </script>
</body>

</html>
